name: deploy
# On a version tag: test, push the Space (backend), deploy the Worker (front door), then smoke-test.
# Needs repo secrets: HF_TOKEN (write), CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. See docs/hosting.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref to deploy (tag), e.g. v0.4.0 (rollback = an older tag)"
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.ref }}" }
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked && uv run pytest -q

  space:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.ref }}" }
      - name: Push deploy/space to the Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          git clone "https://user:${HF_TOKEN}@huggingface.co/spaces/SujayG5/pf-debate" space
          cp deploy/space/Dockerfile deploy/space/README.md space/
          sed -i "s/^ARG REF=.*/ARG REF=${REF}/" space/Dockerfile
          cd space
          git config user.email "actions@github.com" && git config user.name "github-actions"
          git add -A && (git diff --cached --quiet || git commit -m "deploy ${REF}") && git push

  worker:
    needs: space
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.ref }}" }
      - name: No Cloudflare token (Worker was deployed by hand with `npx wrangler deploy`)
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "Skipping Worker deploy; add a CLOUDFLARE_API_TOKEN secret to automate it."
      - uses: cloudflare/wrangler-action@v3
        if: env.HAS_CF_TOKEN == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/worker

  smoke:
    needs: worker
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the new backend, then check the public URL end to end
        run: |
          for i in $(seq 1 40); do   # Space rebuild + library download can take several minutes
            if curl -fsS https://debate.peshcompsci.org/health; then break; fi; sleep 15
          done
          curl -fsS https://debate.peshcompsci.org/health
          curl -fsS https://debate.peshcompsci.org/ | grep -q "debate"
          curl -fsS -X POST https://debate.peshcompsci.org/mcp \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q cut_card
